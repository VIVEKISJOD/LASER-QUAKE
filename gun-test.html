<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LASER QUAKE - Gun Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161c; color: #fff; font-family: sans-serif; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; padding: 14px; text-align: center; font-size: 22px; font-weight: bold; pointer-events: none; }
  #msg { position: fixed; top: 52px; left: 0; right: 0; text-align: center; font-size: 15px; color: #ffb4b4; pointer-events: none; }
  #bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 12px; padding: 16px; box-sizing: border-box; }
  button { flex: 1; font-size: 22px; padding: 18px 0; border: 0; border-radius: 14px; background: #2e7dff; color: #fff; font-weight: bold; }
  button:active { background: #1a55b8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">Loading...</div>
<div id="msg"></div>
<div id="bar">
  <button id="prev">&lt; Back</button>
  <button id="next">Next &gt;</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const names = 'abcdefghijklmnopqr'.split('').map(l => 'blaster-' + l);
let index = 0;
let current = null;

const canvas = document.getElementById('c');
const top = document.getElementById('top');
const msg = document.getElementById('msg');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 0.6, 4);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(3, 5, 4);
scene.add(sun);

const loader = new GLTFLoader();
const pivot = new THREE.Group();
scene.add(pivot);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function show(i) {
  index = (i + names.length) % names.length;
  const name = names[index];
  top.textContent = name + '  (' + (index + 1) + ' / ' + names.length + ')';
  msg.textContent = '';
  if (current) { pivot.remove(current); current = null; }
  loader.load('models/weapons/' + name + '.glb', (gltf) => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const biggest = Math.max(size.x, size.y, size.z) || 1;
    const s = 2.6 / biggest;
    model.scale.setScalar(s);
    model.position.set(-center.x * s, -center.y * s, -center.z * s);
    const holder = new THREE.Group();
    holder.add(model);
    current = holder;
    pivot.add(holder);
  }, undefined, (err) => {
    msg.textContent = 'Load nahi hua: ' + name + '.glb';
    console.error(err);
  });
}

document.getElementById('next').addEventListener('click', () => show(index + 1));
document.getElementById('prev').addEventListener('click', () => show(index - 1));

let dragging = false, lastX = 0, lastY = 0, userRot = false;
canvas.addEventListener('pointerdown', (e) => { dragging = true; userRot = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  pivot.rotation.y += (e.clientX - lastX) * 0.01;
  pivot.rotation.x += (e.clientY - lastY) * 0.01;
  lastX = e.clientX; lastY = e.clientY;
});

function loop() {
  if (!dragging) pivot.rotation.y += 0.01;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
show(0);
loop();
</script>
</body>
</html>
