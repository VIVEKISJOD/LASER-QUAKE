<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LASER QUAKE</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #fff;border-radius:50%;opacity:.8}
#score{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:22px;font-weight:bold;text-shadow:0 0 4px #000}
#dash{position:absolute;bottom:12px;left:50%;width:160px;height:10px;margin-left:-80px;background:#0007;border-radius:5px;overflow:hidden}
#dashf{height:100%;width:100%;background:#3df}
#msg{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:34px;font-weight:bold;text-shadow:0 0 6px #000}
#menu{position:fixed;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
#menu h1{margin:0;font-size:44px;color:#3df}
#menu p{margin:0;color:#ccd;font-size:15px;line-height:1.5}
#go{font-size:24px;padding:16px 42px;border:0;border-radius:14px;background:#2e7dff;color:#fff;font-weight:bold}
.b{position:fixed;border-radius:50%;background:#fff3;border:2px solid #fff7;display:none;align-items:center;justify-content:center;font-weight:bold;font-size:15px}
#bs{right:28px;bottom:40px;width:96px;height:96px;background:#f333}
#bj{right:140px;bottom:24px;width:70px;height:70px}
#bd{right:36px;bottom:150px;width:70px;height:70px}
#jb{position:fixed;width:110px;height:110px;margin:-55px;border-radius:50%;border:2px solid #fff6;display:none;pointer-events:none}
#jk{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fff6}
</style></head><body>
<div id="hud"><div id="cross"></div><div id="score">KILLS 0 / 40</div><div id="msg"></div><div id="dash"><div id="dashf"></div></div></div>
<div id="jb"><div id="jk"></div></div>
<div class="b" id="bs">SHOOT</div><div class="b" id="bj">JUMP</div><div class="b" id="bd">DASH</div>
<div id="menu"><h1>LASER QUAKE</h1>
<p id="info">Pehle 40 kills jeet jaate hain.<br>Ek laser = ek kill.</p>
<p id="help"></p><button id="go">PLAY</button></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id);
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
$('help').innerHTML=TOUCH?'Left: chalne ka joystick<br>Right: ghumao, SHOOT / JUMP / DASH buttons':'WASD chalo, Mouse ghumao, Click = shoot<br>Space = jump, Shift = dash';

const R=new THREE.WebGLRenderer({antialias:false});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x9fd3ff);S.fog=new THREE.Fog(0x9fd3ff,35,95);
const C=new THREE.PerspectiveCamera(75,1,.05,150);S.add(C);
S.add(new THREE.HemisphereLight(0xffffff,0x667788,1.6));
const sun=new THREE.DirectionalLight(0xffffff,1.8);sun.position.set(20,40,10);S.add(sun);
function resize(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---- MAP ---- */
const boxes=[];
function box(x,z,w,d,h,col,y=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y+h/2,z);S.add(m);
  boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,y0:y,y1:y+h});
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshLambertMaterial({color:0xd9c79a}));
ground.rotation.x=-Math.PI/2;S.add(ground);
[[0,-40,80,2],[0,40,80,2],[-40,0,2,80],[40,0,2,80]].forEach(a=>box(a[0],a[1],a[2],a[3],7,0x8a94a6));
box(-15,-12,10,8,5,0xe8e2d0);box(15,12,10,8,5,0xd0dde8);
for(let k=0;k<3;k++){box(-6-k*1.6,-12,1.6,3,1.25*(k+1),0xb59b6a);box(6+k*1.6,12,1.6,3,1.25*(k+1),0xb59b6a)}
[[0,0],[-3,5],[4,-6],[-24,10],[24,-10],[10,-24],[-10,24],[22,24],[-22,-24],[0,14],[0,-14]].forEach((a,i)=>{box(a[0],a[1],2.2,2.2,2.2,i%2?0xc2703a:0x4a8f5c);if(i%3==0)box(a[0],a[1],1.6,1.6,1.6,0xf0c040,2.2)});
[[-28,-4,2,10],[28,4,2,10],[4,-30,10,2],[-4,30,10,2]].forEach(a=>box(a[0],a[1],a[2],a[3],3.5,0x7a8aa0));
const spawns=[[-30,-30],[30,30],[-30,30],[30,-30],[0,-32],[0,32]];

function body(b,dx,dz,dt){
  b.x+=dx;b.z+=dz;b.vy-=24*dt;const py=b.y;b.y+=b.vy*dt;b.ground=false;
  if(b.y<=0){b.y=0;b.vy=0;b.ground=true}
  for(const o of boxes){
    if(b.x>o.x0-.4&&b.x<o.x1+.4&&b.z>o.z0-.4&&b.z<o.z1+.4&&b.y<o.y1&&b.y+1.7>o.y0){
      if(py>=o.y1-.05&&b.vy<=0){b.y=o.y1;b.vy=0;b.ground=true}
      else{
        const l=b.x-(o.x0-.4),r=(o.x1+.4)-b.x,f=b.z-(o.z0-.4),k=(o.z1+.4)-b.z,m=Math.min(l,r,f,k);
        if(m==l)b.x=o.x0-.4;else if(m==r)b.x=o.x1+.4;else if(m==f)b.z=o.z0-.4;else b.z=o.z1+.4;
      }
    }
  }
  b.x=Math.max(-38.6,Math.min(38.6,b.x));b.z=Math.max(-38.6,Math.min(38.6,b.z));
}
function inBox(p){for(const o of boxes)if(p.x>o.x0&&p.x<o.x1&&p.z>o.z0&&p.z<o.z1&&p.y>o.y0&&p.y<o.y1)return true;return false}
const tmp=new THREE.Vector3();
function blocked(a,b){const n=Math.ceil(a.distanceTo(b));for(let i=1;i<n;i++){tmp.lerpVectors(a,b,i/n);if(inBox(tmp))return true}return false}

/* ---- PLAYER ---- */
const P={x:0,y:0,z:0,vy:0,yaw:0,pitch:0,ground:true,cd:0,dashT:0,dx:0,dz:0,fire:0,alive:true,rt:0,prot:0};
let kills=0,playing=false,shooting=false,jumpF=false,dashF=false;
function spawnP(){const s=spawns[Math.floor(Math.random()*6)];P.x=s[0];P.z=s[1];P.y=0;P.vy=0;P.yaw=Math.atan2(-s[0],-s[1]);P.pitch=0;P.alive=true;P.prot=2}
spawnP();

const gun=new THREE.Group();gun.position.set(.2,-.18,-.25);C.add(gun);
new GLTFLoader().load('models/weapons/blaster-e.glb',g=>{const m=g.scene;m.scale.setScalar(.4);m.rotation.y=Math.PI;gun.add(m)},undefined,()=>{
  gun.add(new THREE.Mesh(new THREE.BoxGeometry(.08,.1,.5),new THREE.MeshLambertMaterial({color:0x444455})))});

/* ---- BOLTS ---- */
const bolts=[];const bg=new THREE.BoxGeometry(.08,.08,1.2);
const mP=new THREE.MeshBasicMaterial({color:0x33ffee}),mB=new THREE.MeshBasicMaterial({color:0xff4455});
function shoot(o,d,own){
  const m=new THREE.Mesh(bg,own?mB:mP);m.position.copy(o);S.add(m);
  bolts.push({p:o.clone(),v:d.clone().multiplyScalar(own?38:85),own,m});
}

/* ---- BOTS ---- */
const bots=[];
function mk(c,w,h,d,y){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.y=y;return m}
function newBot(i){
  const g=new THREE.Group(),col=[0xe0443a,0xe08a3a,0xb03ae0,0xe03a8a][i%4];
  g.add(mk(0x333344,.6,.8,.35,.4));g.add(mk(col,.7,.7,.4,1.15));g.add(mk(0xf0d0b0,.4,.4,.4,1.7));
  S.add(g);
  const b={x:0,y:0,z:0,vy:0,g,alive:false,tx:0,tz:0,cd:2,rt:i*.8+1,sx:0,sz:0,st:0};
  bots.push(b);
}
function respawnBot(b){
  let best=spawns[0],bd=-1;
  for(const s of spawns){const d=Math.hypot(s[0]-P.x,s[1]-P.z)+Math.random()*30;if(d>bd){bd=d;best=s}}
  b.x=best[0];b.z=best[1];b.y=0;b.vy=0;b.alive=true;b.g.visible=true;pick(b);b.cd=1.5+Math.random()*2;
}
function pick(b){b.tx=(Math.random()-.5)*68;b.tz=(Math.random()-.5)*68;b.st=1.2;b.sx=b.x;b.sz=b.z}
for(let i=0;i<4;i++){newBot(i);respawnBot(bots[i])}

/* ---- INPUT ---- */
const keys={};
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='ShiftLeft'||e.code=='ShiftRight')dashF=true});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('mousemove',e=>{if(document.pointerLockElement){P.yaw-=e.movementX*.002;P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch-e.movementY*.002))}});
addEventListener('mousedown',e=>{if(document.pointerLockElement&&e.button==0)shooting=true});
addEventListener('mouseup',()=>{shooting=false});
let joy=null,look=null,jx=0,jz=0;
const cv=R.domElement,jb=$('jb'),jk=$('jk');
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType=='mouse')return;
  if(e.clientX<innerWidth*.4&&!joy){joy={id:e.pointerId,sx:e.clientX,sy:e.clientY};jb.style.display='block';jb.style.left=e.clientX+'px';jb.style.top=e.clientY+'px'}
  else if(e.clientX>=innerWidth*.4&&!look)look={id:e.pointerId,x:e.clientX,y:e.clientY};
});
addEventListener('pointermove',e=>{
  if(joy&&e.pointerId==joy.id){let dx=(e.clientX-joy.sx)/50,dy=(e.clientY-joy.sy)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}jx=dx;jz=dy;jk.style.left=(35+dx*35)+'px';jk.style.top=(35+dy*35)+'px'}
  if(look&&e.pointerId==look.id){P.yaw-=(e.clientX-look.x)*.006;P.pitch=Math.max(-1.5,Math.min(1.5,P.pitch-(e.clientY-look.y)*.006));look.x=e.clientX;look.y=e.clientY}
});
function up(e){
  if(joy&&e.pointerId==joy.id){joy=null;jx=jz=0;jb.style.display='none';jk.style.left=jk.style.top='35px'}
  if(look&&e.pointerId==look.id)look=null;
}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
function hold(id,on,off){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();on()});['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,()=>off&&off()))}
hold('bs',()=>shooting=true,()=>shooting=false);hold('bj',()=>jumpF=true,()=>jumpF=false);hold('bd',()=>{dashF=true});
if(TOUCH)['bs','bj','bd'].forEach(i=>$(i).style.display='flex');

$('go').addEventListener('click',()=>{
  if(kills>=40){location.reload();return}
  $('menu').style.display='none';playing=true;
  if(TOUCH){try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}}
  else cv.requestPointerLock();
});

/* ---- LOOP ---- */
const msg=$('msg');let msgT=0;
function say(t,s){msg.textContent=t;msgT=s}
function killPlayer(){P.alive=false;P.rt=1.5;say('MAAR DIYA!',1.5)}
const fw=new THREE.Vector3(),rt=new THREE.Vector3(),eye=new THREE.Vector3(),be=new THREE.Vector3();
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);
  if(playing){
    if(msgT>0){msgT-=dt;if(msgT<=0)msg.textContent=''}
    if(P.alive){
      let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0)+jx,mz=(keys.KeyS?1:0)-(keys.KeyW?1:0)+jz;
      const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l}
      const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
      let wx=mx*cy+mz*sy,wz=-mx*sy+mz*cy;
      P.cd=Math.max(0,P.cd-dt);
      if(dashF&&P.cd<=0){P.dashT=.18;P.cd=3;P.dx=l>.1?wx/l:-sy;P.dz=l>.1?wz/l:-cy}
      dashF=false;
      if(P.dashT>0){P.dashT-=dt;wx=P.dx*3.4;wz=P.dz*3.4}else{wx*=9;wz*=9}
      if((jumpF||keys.Space)&&P.ground)P.vy=8.5;
      body(P,wx*dt,wz*dt,dt);
      P.prot=Math.max(0,P.prot-dt);
      P.fire-=dt;gun.position.z+=(-.25-gun.position.z)*10*dt;
      if(shooting&&P.fire<=0){
        P.fire=.35;C.getWorldDirection(fw);eye.set(P.x,P.y+1.6,P.z).addScaledVector(fw,.6);
        shoot(eye,fw,false);gun.position.z+=.06;
      }
    }else{P.rt-=dt;if(P.rt<=0)spawnP()}
    C.position.set(P.x,P.y+1.6,P.z);C.rotation.set(P.pitch,P.yaw,0,'YXZ');
    eye.set(P.x,P.y+1.6,P.z);
    $('dashf').style.width=(100*(1-P.cd/3))+'%';
    if(P.prot>0&&P.alive)say('SHIELD',.1);

    for(const b of bots){
      if(!b.alive){b.rt-=dt;if(b.rt<=0)respawnBot(b);continue}
      const dx=b.tx-b.x,dz=b.tz-b.z,d=Math.hypot(dx,dz);
      if(d<1.5)pick(b);
      body(b,dx/(d||1)*5*dt,dz/(d||1)*5*dt,dt);
      b.st-=dt;if(b.st<=0){if(Math.hypot(b.x-b.sx,b.z-b.sz)<1.5){pick(b);if(b.ground)b.vy=8.5}else{b.sx=b.x;b.sz=b.z;b.st=1.2}}
      const pd=Math.hypot(P.x-b.x,P.z-b.z);
      be.set(b.x,b.y+1.5,b.z);
      b.g.position.set(b.x,b.y,b.z);
      b.cd-=dt;
      if(pd<40&&P.alive&&!blocked(be,eye)){
        b.g.rotation.y=Math.atan2(P.x-b.x,P.z-b.z);
        if(b.cd<=0&&P.prot<=0){
          b.cd=1.6+Math.random()*1.6;
          tmp.set(P.x+(Math.random()-.5)*1.4,P.y+1.2+(Math.random()-.5)*.8,P.z+(Math.random()-.5)*1.4).sub(be).normalize();
          shoot(be.clone().addScaledVector(tmp,.6),tmp,true);
        }
      }else b.g.rotation.y=Math.atan2(dx,dz);
    }

    for(let i=bolts.length-1;i>=0;i--){
      const o=bolts[i];let dead=false;
      const sp=o.v.length()*dt,n=Math.max(1,Math.ceil(sp/.4));
      for(let s=0;s<n&&!dead;s++){
        o.p.addScaledVector(o.v,dt/n);
        if(o.p.y<0||inBox(o.p)||Math.abs(o.p.x)>40||Math.abs(o.p.z)>40){dead=true;break}
        if(o.own){
          if(P.alive&&P.prot<=0&&Math.hypot(o.p.x-P.x,o.p.z-P.z)<.5&&o.p.y>P.y&&o.p.y<P.y+1.8){killPlayer();dead=true}
        }else for(const b of bots){
          if(b.alive&&Math.hypot(o.p.x-b.x,o.p.z-b.z)<.55&&o.p.y>b.y&&o.p.y<b.y+1.9){
            b.alive=false;b.g.visible=false;b.rt=2;dead=true;kills++;
            $('score').textContent='KILLS '+kills+' / 40';say('+1 KILL',.6);
            if(kills>=40){
              playing=false;if(document.pointerLockElement)document.exitPointerLock();
              $('info').innerHTML='JEET GAYE! 40 kills!';$('go').textContent='PHIR SE';$('menu').style.display='flex';
            }
            break;
          }
        }
      }
      if(dead){S.remove(o.m);bolts.splice(i,1)}
      else{o.m.position.copy(o.p);o.m.lookAt(tmp.copy(o.p).add(o.v))}
    }
  }
  R.render(S,C);
}
frame();
</script></body></html>
